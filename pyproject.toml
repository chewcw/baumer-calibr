[project]
name = "baumer-calib"
version = "0.1.0"
description = "Simple CLI to calibrate Baumer VCXG.2/VCXU.2 cameras (OpenCV) and store results in boCalibrationData"
readme = "README.md"
authors = [
    { name = "ChewCW", email = "chwai87@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
baumer-calib = "baumer_calib.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
